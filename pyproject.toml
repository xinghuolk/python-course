[project]
name = "python-lesson"
version = "0.1.0"
description = "个性化 Python 自学课程系统"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jupyter>=1.0"]

[tool.pytest.ini_options]
testpaths = ["lessons"]
python_files = ["test_*.py", "*_test.py"]
